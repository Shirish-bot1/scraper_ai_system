services:
  postgres:
    image: postgres:16
    container_name: mofaga_postgres
    restart: always

    environment:
      POSTGRES_DB: ${db_name}
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${postgres_password}}

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: mofaga_backend
    restart: always

    env_file:
      - ./backend/.env

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: mofaga_frontend
    restart: always

    depends_on:
      - backend

    ports:
      - "5173:5173"

volumes:
  postgres_data: